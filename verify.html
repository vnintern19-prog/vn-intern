<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Certificate Verification | VN INTERN</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f8ff;
      color: #0b1d45;
      line-height: 1.6;
    }

    nav {
      background: #071a3d;
      color: white;
      padding: 16px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #2386e8;
    }

    .home-link {
      color: white;
      text-decoration: none;
      font-size: 15px;
    }

    .home-link:hover {
      color: #2386e8;
    }

    .hero {
      background: linear-gradient(135deg, #071a3d, #0d4fa8);
      color: white;
      text-align: center;
      padding: 65px 20px;
    }

    .hero h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .hero p {
      color: #dceaff;
    }

    .main-section {
      padding: 60px 20px;
      min-height: 65vh;
    }

    .certificate-box {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 40px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(7, 26, 61, 0.12);
    }

    .verified-header {
      text-align: center;
      padding-bottom: 25px;
      border-bottom: 1px solid #dce5f4;
      margin-bottom: 20px;
    }

    .check {
      width: 70px;
      height: 70px;
      background: #1b9c4a;
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      font-size: 35px;
    }

    .verified-header h2 {
      color: #16783a;
      font-size: 28px;
    }

    .verified-header p {
      color: #65738b;
    }

    .details {
      margin-top: 20px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 30px;
      padding: 14px 5px;
      border-bottom: 1px solid #edf1f7;
    }

    .detail strong {
      color: #071a3d;
    }

    .detail span {
      color: #52617a;
      text-align: right;
    }

    .invalid-box {
      max-width: 700px;
      margin: auto;
      text-align: center;
      background: white;
      padding: 50px 30px;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(7, 26, 61, 0.12);
    }

    .invalid-icon {
      font-size: 65px;
      margin-bottom: 15px;
    }

    .invalid-box h2 {
      color: #b42318;
      margin-bottom: 10px;
    }

    .invalid-box p {
      color: #65738b;
      margin-bottom: 25px;
    }

    .btn {
      display: inline-block;
      background: linear-gradient(135deg, #2386e8, #0b3f91);
      color: white;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 8px;
      font-weight: bold;
    }

    footer {
      background: #041126;
      color: #bfcce0;
      text-align: center;
      padding: 28px 20px;
    }

    footer strong {
      color: white;
    }

    @media (max-width: 600px) {

      nav {
        flex-direction: column;
        gap: 10px;
      }

      .hero h1 {
        font-size: 34px;
      }

      .certificate-box {
        padding: 25px 18px;
      }

      .detail {
        flex-direction: column;
        gap: 4px;
      }

      .detail span {
        text-align: left;
      }

    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <nav>

    <div class="logo">
      VN <span>INTERN</span>
    </div>

    <a href="index.html" class="home-link">
      ← Back to Home
    </a>

  </nav>

  <!-- HERO -->
  <section class="hero">

    <h1>Certificate Verification</h1>

    <p>
      Official VN INTERN Certificate Verification System
    </p>

  </section>

  <!-- MAIN CONTENT -->
  <section class="main-section">

    <div id="verificationResult"></div>

  </section>

  <!-- FOOTER -->
  <footer>

    <p>
      <strong>VN INTERN</strong> — Train • Intern • Transform
    </p>

    <br>

    <p>
      📧 vnintern19@gmail.com
      &nbsp; | &nbsp;
      📞 9798251318, 6202113675
    </p>

    <br>

    <p>© 2026 VN INTERN. All Rights Reserved.</p>

  </footer>


  <!-- CERTIFICATE DATABASE -->
  <script src="certificates.js"></script>

  <script>

    // URL se Certificate Number nikalna
    const params = new URLSearchParams(window.location.search);

    const certificateNumber =
      params.get("cert")?.trim().toUpperCase();

    const result =
      document.getElementById("verificationResult");


    // Certificate mil gaya
    if (
      certificateNumber &&
      certificates[certificateNumber]
    ) {

      const certificate =
        certificates[certificateNumber];

      result.innerHTML = `

        <div class="certificate-box">

          <div class="verified-header">

            <div class="check">✓</div>

            <h2>CERTIFICATE VERIFIED</h2>

            <p>
              This is a valid certificate issued by VN INTERN.
            </p>

          </div>


          <div class="details">

            <div class="detail">
              <strong>Name</strong>
              <span>${certificate.name}</span>
            </div>

            <div class="detail">
              <strong>Course</strong>
              <span>${certificate.course}</span>
            </div>

            <div class="detail">
              <strong>Branch / Field</strong>
              <span>${certificate.branch}</span>
            </div>

            <div class="detail">
              <strong>College / Institute</strong>
              <span>${certificate.college}</span>
            </div>

            <div class="detail">
              <strong>Program</strong>
              <span>${certificate.program}</span>
            </div>

            <div class="detail">
              <strong>Duration</strong>
              <span>${certificate.duration}</span>
            </div>

            <div class="detail">
              <strong>Issue Date</strong>
              <span>${certificate.issueDate}</span>
            </div>

            <div class="detail">
              <strong>Certificate Number</strong>
              <span>${certificate.certificateNo}</span>
            </div>

            <div class="detail">
              <strong>Verification Status</strong>
              <span style="color:#16783a;font-weight:bold;">
                ✓ ${certificate.status}
              </span>
            </div>

          </div>

        </div>

      `;

    }


    // Certificate nahi mila
    else {

      result.innerHTML = `

        <div class="invalid-box">

          <div class="invalid-icon">❌</div>

          <h2>Certificate Not Found</h2>

          <p>
            The certificate link is invalid or the certificate
            could not be found in the VN INTERN verification database.
          </p>

          <a href="certificate.html" class="btn">
            Verify Certificate Number
          </a>

        </div>

      `;

    }

  </script>

</body>
</html>
